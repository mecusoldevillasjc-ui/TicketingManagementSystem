spring.application.name=ticketing-management-system
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# Database. Works locally as-is; on a host (Railway, Render...) set DATABASE_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ticketing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 'update' builds and adjusts the tables automatically. Use 'validate' in production.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Creates 12 sample tickets on an empty database so the dashboards have data. Set to false for real use.
app.seed-demo=${SEED_DEMO:true}
